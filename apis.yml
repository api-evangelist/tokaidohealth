aid: tokaidohealth
name: Tokaido Health
description: 'Tokaido Health is an AI-native medication steerage platform anchored in
  behavioral economics that helps employers and health plans cut pharmacy costs. It
  identifies same-or-better medications that cost less - via site-of-care steerage,
  biosimilar substitution, formulary optimization, and polypharmacy reconciliation -
  and pairs recommendations with incentives that get members to switch, layering on
  top of the existing PBM and benefits stack. Founded in 2025 in San Mateo, CA; raised
  $25M in May 2026 led by Norwest Venture Partners. No public API surface is published.'
